[tox]
env_list = lint, type, py310, py311, py312, py313, py39-helper
requires = tox-uv>=1.37

[testenv]
dependency_groups = test
commands = pytest {posargs}

[testenv:py39-helper]
# The remote helper must stay importable and working on Python 3.9.
base_python = python3.9
skip_install = true
dependency_groups =
deps = pytest
set_env = PYTHONPATH = {tox_root}/src
commands = pytest tests/helper {posargs}

[testenv:lint]
dependency_groups = lint
commands =
    ruff check src tests
    ruff format --check src tests

[testenv:type]
dependency_groups = lint
commands = mypy
